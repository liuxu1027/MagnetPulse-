name: Build MagnetPulse Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006'

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust librqbit Core & Generate UniFFI Bindings
        working-directory: native/rust-core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.1.12297006
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o ../android-app/app/src/main/jniLibs build --release
          cargo run --bin uniffi-bindgen generate src/magnet_engine.udl \
          --config uniffi.toml \
            --language kotlin --out-dir ../android-app/app/src/main/java

      - name: Setup Gradle & Build APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > native/android-app/app/release.keystore
          test -f native/android-app/app/release.keystore || (echo "keystore missing - check Secrets" && exit 1)

      - name: Assemble Release APK
        working-directory: native/android-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MagnetPulse-Android-Release-APK
          path: native/android-app/app/build/outputs/apk/release/*.apk
      - name: Upload Rust Prebuilt (.so & Kotlin Bindings)
        uses: actions/upload-artifact@v4
        with:
          name: MagnetPulse-Rust-Prebuilt
          path: |
            native/android-app/app/src/main/jniLibs
            native/android-app/app/src/main/java/uniffi
